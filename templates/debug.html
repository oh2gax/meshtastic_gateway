{% extends "base.html" %}
{% block body %}
<div class="page-head">
  <h5><i class="bi bi-terminal"></i> Debug terminal</h5>
  <div class="toolbar">
    <button class="btn btn-sm btn-outline-secondary" id="pauseBtn"><i class="bi bi-pause-fill"></i> <span>Pause</span></button>
    <button class="btn btn-sm btn-outline-secondary" id="copyBtn"><i class="bi bi-clipboard"></i> <span>Copy</span></button>
    <form method="post" action="{{ url_for('debug_clear_post') }}" class="m-0">
      <button class="btn btn-sm btn-outline-danger" type="submit" onclick="return confirm('Clear debug buffer?');"><i class="bi bi-trash3"></i> Clear</button>
    </form>
  </div>
</div>

<div class="card mb-3"><div class="card-body py-2">
  <div class="row g-2">
    <div class="col-md-3">
      <label class="form-label small text-body-secondary mb-1">Type</label>
      <select class="form-select form-select-sm" id="typeSel">
        <option value="all">All</option>
        <option value="text">Text</option>
        <option value="position">Position</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label small text-body-secondary mb-1">Node</label>
      <select class="form-select form-select-sm mono" id="nodeSel">
        <option value="">All nodes</option>
        {% for n in debug_nodes %}
          <option value="{{ n['node_id'] }}">{{ node_display(n["long_name"], n["short_name"], n["node_id"]) }} — {{ n['node_id'] }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label small text-body-secondary mb-1">Last N</label>
      <input class="form-control form-control-sm" id="nSel" type="number" min="1" max="{{maxn}}" value="{{default_n}}">
    </div>
    <div class="col-md-2">
      <label class="form-label small text-body-secondary mb-1">Refresh</label>
      <select class="form-select form-select-sm" id="rateSel">
        <option value="1">1s</option>
        <option value="2" selected>2s</option>
        <option value="5">5s</option>
        <option value="10">10s</option>
      </select>
    </div>
  </div>
</div></div>

<pre class="debugbox" id="debugBox"></pre>

<script>
  let paused = false;
  let timer = null;

  function params() {
    const n = document.getElementById("nSel").value || "40";
    const typ = document.getElementById("typeSel").value || "all";
    const node = (document.getElementById("nodeSel").value || "").trim();
    return new URLSearchParams({ n, typ, node });
  }

  async function refreshDebug() {
    if (paused) return;
    try {
      const res = await fetch("/debug/data?" + params().toString(), {cache: "no-store"});
      const data = await res.json();
      document.getElementById("debugBox").textContent = data.text;
    } catch (e) {
      document.getElementById("debugBox").textContent = "Fetch error: " + e;
    }
  }

  function setTimer() {
    if (timer) clearInterval(timer);
    const rate = parseInt(document.getElementById("rateSel").value || "2", 10) * 1000;
    timer = setInterval(refreshDebug, rate);
  }

  const pauseBtn = document.getElementById("pauseBtn");
  pauseBtn.addEventListener("click", () => {
    paused = !paused;
    pauseBtn.querySelector("span").textContent = paused ? "Resume" : "Pause";
    pauseBtn.querySelector("i").className = paused ? "bi bi-play-fill" : "bi bi-pause-fill";
  });

  const copyBtn = document.getElementById("copyBtn");
  copyBtn.addEventListener("click", async () => {
    const txt = document.getElementById("debugBox").textContent || "";
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(txt);
      } else {
        const ta = document.createElement("textarea");
        ta.value = txt;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        if (!ok) throw new Error("execCommand copy failed");
      }
      copyBtn.querySelector("span").textContent = "Copied";
      setTimeout(() => copyBtn.querySelector("span").textContent = "Copy", 800);
    } catch (e) {
      copyBtn.querySelector("span").textContent = "Copy failed";
      setTimeout(() => copyBtn.querySelector("span").textContent = "Copy", 1500);
    }
  });

  for (const id of ["typeSel","nodeSel","nSel"]) {
    document.getElementById(id).addEventListener("change", refreshDebug);
  }
  document.getElementById("rateSel").addEventListener("change", setTimer);

  setTimer();
  refreshDebug();
</script>
{% endblock %}
