{% extends "base.html" %}
{% block body %}
<div class="page-head">
  <h5><i class="bi bi-pencil-square"></i> Send message</h5>
</div>

<div class="row">
  <div class="col-lg-8">
    <form method="post" action="{{ url_for('send_post') }}" class="card card-body">
      <div class="mb-3">
        <label class="form-label fw-medium">Destination</label>
        <select class="form-select" name="to_id" id="destSel">
          <option value="" {{ "selected" if not to_id_prefill else "" }}>BROADCAST (pick channel below)</option>
          {% for r in rows %}
            <option value="{{ r['node_id'] }}" {{ "selected" if r['node_id']==to_id_prefill else "" }}>
              {{ node_display(r["long_name"], r["short_name"], r["node_id"]) }} — {{ r['node_id'] }} [RSSI {{ r['last_rssi'] }}, SNR {{ r['last_snr'] }}]
            </option>
          {% endfor %}
        </select>
        <div class="form-text">Dropdown uses nodes heard in window={{ window }}{% if to_id_prefill %} (plus the reply target){% endif %}.</div>
      </div>

      <div class="mb-3" id="chanBlock">
        <label class="form-label fw-medium">Broadcast channel</label>
        <select class="form-select" name="channel">
          {% for c in channels %}
            <option value="{{ c.index }}" {% if c.index == selected_channel %}selected{% endif %}>{{ c.label }}</option>
          {% endfor %}
        </select>
        <div class="form-text">Only used when the destination is BROADCAST. Ignored for direct messages.</div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-medium">Message</label>
        <textarea class="form-control" name="text" rows="3" maxlength="240" required data-counter="sendCount"></textarea>
        <div class="char-count" id="sendCount"></div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Queue message</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('outbox_view') }}">Outbox</a>
      </div>
    </form>
  </div>
</div>

<script>
  // Dim the channel picker when a DM destination is selected (it's ignored then).
  (function () {
    var dest = document.getElementById('destSel'), blk = document.getElementById('chanBlock');
    if (!dest || !blk) return;
    function upd() { blk.style.opacity = dest.value ? '0.45' : '1'; }
    dest.addEventListener('change', upd); upd();
  })();
</script>
{% endblock %}
